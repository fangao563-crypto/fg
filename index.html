<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>整点报时 App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>🕒 整点报时</h1>
      <p class="desc">到整点自动播放提示音，并可语音播报当前时间。</p>

      <section class="panel">
        <div class="row">
          <span>当前时间</span>
          <strong id="currentTime">--:--:--</strong>
        </div>
        <div class="row">
          <span>下次报时</span>
          <strong id="nextChime">--:--</strong>
        </div>
      </section>

      <section class="controls">
        <label>
          <input type="checkbox" id="enableSpeech" checked />
          启用语音播报
        </label>
        <button id="testChime" type="button">立即测试报时</button>
      </section>

      <p id="status" class="status">等待中...</p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
